---
name: pkg.pr.new
on:
  push: { branches: [master] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: pkg-pr-new-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx pkg-pr-new publish --bun --bin --packageManager=npm,bun,pnpm
