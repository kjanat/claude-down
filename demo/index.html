<!DOCTYPE html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8">
		<link rel="canonical" href="https://kjanat.github.io/claude-down/">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="all, follow, index">

		<title>claude-down</title>
		<meta name="description" content="Live Anthropic service status dashboard using claude-down">
		<meta name="theme-color" content="#e2e8f0">

		<link
			rel="preload"
			href="https://status.claude.com/api/v2/summary.json"
			as="fetch"
			type="application/json"
			crossorigin
		>
		<link rel="stylesheet" href="style.css">
		<link id="favicon" rel="icon" href="assets/claude-down.svg" type="image/svg+xml" sizes="any">
		<script src="main.ts" type="module"></script>
	</head>

	<body translate="no">
		<main class="dashboard">
			<header>
				<div class="logo">
					<span id="name">claude-down</span>
				</div>
				<div id="last-updated" class="status"></div>
			</header>

			<noscript>
				<div class="noscript-card">
					JavaScript is disabled. For terminal status, run <code>npx claude-down</code>.
				</div>
			</noscript>

			<section class="hero" id="hero">
				<div class="hero-inner">
					<div id="hero-icon" class="hero-icon loading"></div>
					<div>
						<div id="hero-title" class="hero-title">Checking status…</div>
						<div id="hero-sub" class="hero-sub"></div>
					</div>
				</div>
			</section>

			<section class="section">
				<h2>Incidents</h2>
				<div id="incidents-list" class="incidents-list">
					<div class="loading-row">Loading…</div>
				</div>
			</section>

			<section class="section">
				<h2>Components</h2>
				<div id="components-grid" class="components-grid">
					<div class="loading-row">Loading…</div>
				</div>
			</section>

			<footer class="footer" aria-label="Project links">
				<a
					class="footer-link footer-link-github"
					href="https://github.com/kjanat/claude-down"
					aria-label="claude-down on GitHub"
					target="_blank"
					rel="noreferrer"
				></a>
				<a
					class="footer-link footer-link-npm"
					href="https://www.npmjs.com/package/claude-down"
					aria-label="claude-down on npm"
					target="_blank"
					rel="noreferrer"
				></a>
			</footer>
		</main>
	</body>
</html>
